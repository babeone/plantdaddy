<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f1a14" />
		<meta name="color-scheme" content="dark" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- iOS ignora il manifest per l'icona della Home: usa questa. -->
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="PlantDaddy" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<!-- class e non style="display:contents": con la CSP a style-src 'self'
		     un attributo style inline verrebbe bloccato. -->
		<div class="app-root">%sveltekit.body%</div>
	</body>
</html>
